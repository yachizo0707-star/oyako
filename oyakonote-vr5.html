<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="親子のおだやかノート">
<title>親子のおだやかノート</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  background: #fbf6ef; color: #3b3a36; line-height: 1.75; font-size: 16px;
}
#app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
#main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px 16px 24px; }
.wrap { max-width: 560px; margin: 0 auto; }
h1 { font-size: 20px; font-weight: 700; color: #3f6f66; }
h2 { font-size: 17px; font-weight: 700; margin-bottom: 8px; color: #3f6f66; }
h3 { font-size: 15px; font-weight: 700; margin: 10px 0 4px; color: #3f6f66; }
.sub { font-size: 13px; color: #8a857b; }
.card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(80,60,30,.07); }
.card.warm { background: #fff3e6; }
.card.green { background: #eaf4f1; }
.hello { font-size: 17px; font-weight: 600; line-height: 1.8; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; color: #fff; background: #5b8f85; padding: 2px 10px; border-radius: 999px; margin-bottom: 8px; }
.tag.o { background: #e8956b; }
.step { margin-top: 10px; padding: 10px 12px; background: #fff; border-left: 4px solid #e8956b; border-radius: 8px; font-size: 15px; }
.card.warm .step, .card.green .step { background: #fff; }
.btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; color: #fff; background: #5b8f85; margin-top: 10px; }
.btn.o { background: #e8956b; }
.btn.ghost { background: #fff; color: #3f6f66; border: 2px solid #5b8f85; }
.btn.small { width: auto; display: inline-block; padding: 8px 16px; font-size: 14px; margin-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.chip { padding: 9px 14px; border-radius: 999px; border: 2px solid #d9d2c5; background: #fff; font-size: 14px; color: #3b3a36; }
.chip.on { background: #5b8f85; border-color: #5b8f85; color: #fff; font-weight: 700; }
.chip.on.o { background: #e8956b; border-color: #e8956b; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: #ece5d8; border-radius: 12px; padding: 4px; margin-bottom: 14px; }
.seg button { flex: 1 1 30%; border: none; background: transparent; padding: 9px 2px; border-radius: 9px; font-size: 13px; font-weight: 700; color: #8a857b; }
.seg button.on { background: #fff; color: #3f6f66; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
input[type=text], textarea { width: 100%; font-size: 16px; padding: 12px; border: 2px solid #e2dacb; border-radius: 12px; background: #fff; font-family: inherit; color: #3b3a36; }
textarea { min-height: 72px; resize: none; }
.lvl { display: flex; gap: 8px; margin: 8px 0; }
.lvl button { flex: 1; padding: 12px 0; border-radius: 12px; border: 2px solid #d9d2c5; background: #fff; font-size: 16px; font-weight: 700; color: #8a857b; }
.lvl button.on { background: #e8956b; border-color: #e8956b; color: #fff; }
.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.rec { padding: 10px 0; border-bottom: 1px solid #f0ebe0; font-size: 15px; }
.rec:last-child { border-bottom: none; }
.rec .meta { font-size: 12px; color: #8a857b; }
.del { border: none; background: none; color: #b5ada0; font-size: 13px; padding: 4px 6px; }
.bar-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
.bar-row .name { width: 112px; flex-shrink: 0; }
.bar { flex: 1; background: #f0ebe0; border-radius: 6px; height: 14px; overflow: hidden; }
.bar > div { height: 100%; background: #e8956b; border-radius: 6px; }
.bar-row .n { width: 24px; text-align: right; color: #8a857b; }
.before { color: #b0614a; font-weight: 700; font-size: 15px; }
.after { color: #3f6f66; font-weight: 600; font-size: 15px; margin-top: 6px; }
.why { font-size: 13px; color: #7a766c; margin-top: 8px; }
.stats { display: flex; gap: 8px; }
.stat { flex: 1; background: #fff; border-radius: 14px; padding: 10px 4px; text-align: center; box-shadow: 0 2px 10px rgba(80,60,30,.07); }
.stat .big { font-size: 24px; font-weight: 800; color: #3f6f66; line-height: 1.2; }
.stat .lab { font-size: 11px; color: #8a857b; }
.breath-area { text-align: center; padding: 8px 0 4px; }
.circle { width: 120px; height: 120px; border-radius: 50%; margin: 10px auto; background: radial-gradient(circle at 35% 30%, #bfe0d8, #5b8f85); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px; }
.circle.run { animation: breathe 10s ease-in-out infinite; }
@keyframes breathe { 0% { transform: scale(.75); } 40% { transform: scale(1.15); } 100% { transform: scale(.75); } }
.chk { display: flex; align-items: center; gap: 12px; padding: 4px 0; border-bottom: 1px solid #f0ebe0; }
.chk:last-child { border-bottom: none; }
.chk .box { flex: 1; display: flex; align-items: center; gap: 12px; border: none; background: none; padding: 10px 0; text-align: left; font-size: 16px; color: #3b3a36; font-family: inherit; }
.chk .mark { width: 28px; height: 28px; border-radius: 8px; border: 2px solid #c9c1b2; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; flex-shrink: 0; }
.chk.done .mark { background: #5b8f85; border-color: #5b8f85; }
.chk.done .nm { color: #9a958a; text-decoration: line-through; }
.timer-disp { font-size: 56px; font-weight: 800; color: #3f6f66; text-align: center; font-variant-numeric: tabular-nums; line-height: 1.2; margin: 8px 0; }
.progress { height: 10px; background: #f0ebe0; border-radius: 6px; overflow: hidden; margin: 6px 0 10px; }
.progress > div { height: 100%; background: #5b8f85; border-radius: 6px; transition: width .3s; }
.say { background: #f6faf8; border-radius: 10px; padding: 10px 12px; margin-top: 6px; font-size: 15px; }
.say b { color: #3f6f66; }
.ng { color: #b0614a; font-size: 14px; margin: 4px 0; }
.ref a { color: #3f6f66; font-size: 13px; display: block; padding: 5px 0; word-break: break-all; }
#nav { display: flex; background: #fff; border-top: 1px solid #e8e0d1; padding-bottom: env(safe-area-inset-bottom); }
#nav button { flex: 1; border: none; background: none; padding: 8px 0 7px; font-size: 10px; color: #a39d90; font-weight: 700; }
#nav button .ic { display: block; font-size: 20px; line-height: 1.2; }
#nav button.on { color: #3f6f66; }
.modal-overlay { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,.5); align-items: center; justify-content: center; padding: 24px; }
.modal-overlay.active { display: flex; }
.modal-box { background: #fff; border-radius: 18px; padding: 22px; width: 100%; max-width: 340px; }
.modal-title { font-weight: 700; margin-bottom: 14px; }
.modal-btns { display: flex; gap: 10px; }
.modal-btns button { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; }
.m-yes { background: #e8956b; color: #fff; }
.m-no { background: #ece5d8; color: #3b3a36; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom)); background: #3f6f66; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 500; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; }
.empty { color: #a39d90; font-size: 14px; text-align: center; padding: 14px 0; }
.note { font-size: 12px; color: #a39d90; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div id="app">
  <div id="main"><div class="wrap" id="view"></div></div>
  <div id="nav">
    <button data-tab="home" class="on"><span class="ic">🏠</span>ホーム</button>
    <button data-tab="voice"><span class="ic">💬</span>声かけ</button>
    <button data-tab="forget"><span class="ic">🧩</span>仕組み</button>
    <button data-tab="pause"><span class="ic">🍃</span>ひと呼吸</button>
    <button data-tab="log"><span class="ic">📝</span>記録</button>
    <button data-tab="review"><span class="ic">📊</span>ふり返り</button>
  </div>
</div>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <div class="modal-title">この項目を削除しますか？</div>
    <div class="modal-btns">
      <button class="m-no" id="m-no">やめる</button>
      <button class="m-yes" id="m-yes">削除する</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- 保存(プライベートブラウズ対策でtry/catch) ---------- */
var KEY = 'oyakonote_v1';
function safeGet(key, fallback) {
  try { var v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function safeSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}
var state = safeGet(KEY, null) || {};
if (!state.irritations) state.irritations = [];
if (!state.goods) state.goods = [];
if (!state.items) state.items = [];
if (!state.checks) state.checks = {};
if (!state.forgot) state.forgot = [];
if (!state.goals) state.goals = {};
if (!state.sessions) state.sessions = {};
if (!state.paper) state.paper = {};
if (!state.routine) state.routine = {};
function save() { safeSet(KEY, state); }

/* ---------- 日付ユーティリティ ---------- */
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayStr() { return ymd(new Date()); }
function dayOfYear() { var n = new Date(); var s = new Date(n.getFullYear(), 0, 0); return Math.floor((n - s) / 86400000); }
function daysAgoStr(k) { var d = new Date(); d.setDate(d.getDate() - k); return ymd(d); }
function dispDate(s) { var p = s.split('-'); return parseInt(p[1], 10) + '/' + parseInt(p[2], 10); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ---------- コンテンツ ---------- */
var CARE = [
  '平日はほぼお一人で、お仕事も家のことも、娘さんの支度や勉強まで担っている毎日。それだけで、もう十分に頑張っています。',
  '毎日、娘さんのことを一番に考えて向き合っていらっしゃいますね。その熱量は、娘さんにとって大きな安心の土台です。',
  '「どうしたらもっと良くなるか」を真剣に考え続けているのは、それだけ深い愛情があるからです。',
  '今日もお疲れさまです。パートと家事、そして娘さんのサポートまで。全部を完璧にやろうとしなくて大丈夫です。',
  '悩むのは、娘さんを大切に思っている証拠です。まずは今日の自分をねぎらってください。',
  '娘さんが「口出ししないで」と言えるのは、家が本音を出せる安全な場所だからでもあります。',
  '完璧な親は、どこにもいません。迷いながらも向き合い続けているあなたの姿が、一番の支えになっています。',
  '朝の支度から夜の宿題まで、一人で回すのは本当に大変なことです。今日は「最低限できたらOK」にしましょう。'
];

var TIPS = [
  { t: '「口出ししないで」は、成長のサインです',
    b: '中学生は「自分のことは自分で決めたい」という気持ちが急に強くなる時期です。「何も知らないのに口出ししないで」は反抗というより、自立が始まったサイン。接し方が悪いという意味ではありません。',
    s: '今日は勉強中の姿勢に一言も触れず、終わったあとに「お疲れさま」だけ伝えてみる。' },
  { t: '「今からやろうと思っていたのに」は本当です',
    b: 'ご自身にも「今やろうと思っていたのに言われてやる気がなくなった」経験はありませんか。思春期は特に、言われる前の「自分で始めたい」気持ちが強い時期です。',
    s: '声をかける前に、あと10分だけ待ってみる。' },
  { t: '疲れているとき、脳は計画できません',
    b: '朝5時起きで部活もある毎日は、大人でいえば残業続きの状態です。直前になって慌てるのは怠けではなく、エネルギー切れが原因のことも多くあります。',
    s: '帰宅後30分は勉強の話をせず、おやつと休憩の時間にしてみる。' },
  { t: '直前に慌てるのは、この年ごろの「あるある」です',
    b: '先を見通して段取りを組む力は、中学生ではまだ発達の途中です。進学校でも同じで、できないのは本人の性格より年齢の特徴によるところが大きいといえます。',
    s: '「いつやる?」と聞き、娘さん自身に時間を1つだけ決めてもらう。' },
  { t: '怒って動かすと、その場しか動きません',
    b: '怒られて始めた勉強は「怒られないと始まらない」習慣になりやすく、親も子もだんだん消耗します。聞かれて自分で決めたことのほうが、長く続きます。',
    s: '今日は怒らずに1回だけ、「今日の宿題、何から始める?」と聞いてみる。' },
  { t: '「傾聴 → 承認 → 質問」の順で声をかける',
    b: '指示や命令の前に、まず聞く、次に認める、最後に質問する。この順番が、子どものやる気を引き出す基本とされています。「声かけ」タブに場面別の例があります。',
    s: '今日は、1回だけこの順番で声をかけてみる。' },
  { t: '手を止めて聞く、それだけで信頼が育ちます',
    b: 'スマホを見ながらの「うん、うん」より、手を止めて顔を見て聞く数十秒のほうが、子どもには強く伝わります。忙しい毎日だからこそ、短くて十分です。',
    s: '娘さんが話しかけてきたら、1回だけ手を止めて最後まで聞く。' },
  { t: '紙に書くと、勉強が「見える」ようになります',
    b: 'だらだらして見えても、書いてみると実際にやったことが見える日があります。やったことが目に見えると、親は急かす声かけが減らしやすくなり、娘さんも「ここまでやった」と実感しやすくなります。書くのは娘さん自身にしてもらいます。',
    s: '今日は、娘さんが書いた紙を見て「お疲れさま」と、今日一番進んだところを聞いてみる。' },
  { t: 'だらだらの中身を、まず見てみましょう',
    b: 'だらだらして見えるときは、疲れ、何をどこまでやるか決まっていない、始める切り替えが重い、集中が続かない、休憩が長引く、わからなくて止まっている、などの理由が隠れていることがあります。「仕組み」タブの「だらだらの理由さがし」で整理できます。',
    s: '今日は急かさず、だらだらの理由を1つだけ当ててみる。' },
  { t: '集中は、短く区切るほうが続きます',
    b: '集中力は長く続くものではなく、作業と休憩を短く繰り返すほうが効率的だと言われています。時間の長さより、勉強の質のほうが大切です。',
    s: '今日は「15分だけ」と区切って、娘さん自身にタイマーを押してもらう。' },
  { t: '勉強中は話しかけず、終わってから声をかける',
    b: '勉強中は話しかけないほうが集中しやすいとされています。気になっても、声かけは区切りがついてからにして、そのときは「お疲れさま」を先に伝えます。',
    s: '今日は勉強中の声かけを、終わるまで我慢してみる。' },
  { t: '同級生の話が出たら、「聞く」だけでいい',
    b: '娘さんが優秀な同級生の話をするのは、自慢でも比較の合図でもなく、ただ話したいだけのことが多いものです。比べる言葉を返すと、次から話してくれなくなることがあります。',
    s: '同級生の話が出たら、「その子のどこがすごいと思った?」とだけ聞いてみる。' },
  { t: '周りと比べて落ち込むのは、娘さんも同じです',
    b: '思春期は、周りと自分を比べて劣等感や自己嫌悪を抱きやすい時期だと言われています。親が他の子と比べると、娘さんの「自分はダメだ」という気持ちを強めてしまうことがあります。',
    s: '今日は、他の子ではなく「娘さん自身の良いところ」を1つ探す。' },
  { t: '忘れ物が多いのは、叱られ続けやすい苦手です',
    b: '忘れ物や遅刻を繰り返す人は、何度も叱られて自己否定的になりやすいと言われます。まず「忘れなかった日」「ちゃんと持っていけた日」を一緒に思い出すのが効果的です。',
    s: '「忘れ物ゼロだった日もあったよね」と、うまくいった日に1回だけ触れてみる。' },
  { t: '忘れ物は、叱るより仕組みで減ります',
    b: '前夜に準備して決まった場所に置く、持ち物を1か所にまとめるなど、仕組みを作ったほうが確実に減ります。「忘れ物」タブに前夜チェック表を用意しました。',
    s: '今夜、娘さんと一緒に持ち物チェック表を1つだけ作ってみる。' },
  { t: 'チェック表は、本人が書くから続きます',
    b: '親が作ったチェック表は他人事になりやすく、本人が自分で考えて書いたものが一番習慣になる、という経験談があります。項目を一緒に考えるところから始めてみてください。',
    s: '娘さんに「何があれば忘れ物が減りそう?」と聞いて、書いてもらう。' },
  { t: 'サポートは「一緒 → 見守り → 確認」の3段階',
    b: '最初は一緒に支度し、次に見守り、最後に本人がやったものを確認する。段階を踏みながら、少しずつ手を離していくのが理想とされています。やり過ぎると過保護、放置すると定着しません。',
    s: '今夜は「一緒に」でなく「見守り」に1段階だけ進めてみる。' },
  { t: '朝に余裕があると、忘れ物は減ります',
    b: '朝食も取れないほど慌ただしいと、忘れ物のリスクは上がります。前夜に準備を済ませておけば、朝は確認だけで出られます。5時起きの娘さんには特に有効です。',
    s: '今夜の準備を、寝る30分前までに済ませる流れを作る。' },
  { t: '質問は、命令より届きます',
    b: '「やりなさい」は指示ですが、「どうする?」は選択です。自分で決めた感覚が残ると、動く力も出やすくなります。「なぜ」より「何」「どうなったらいい?」で聞くのがコツです。',
    s: '「やりなさい」を言いそうになったら、「何から始める?」に置き換えてみる。' },
  { t: '中身を知らずに口出しすると、反発されます',
    b: '何をやっているのか知らないまま姿勢だけ注意されると、子どもは「分かってもらえていない」と感じます。まずは中身への関心を向けるところからです。',
    s: '「今日の授業で一番おもしろかったのは?」と聞くだけにする。' },
  { t: '受け止めることと、許すことは別です',
    b: '「忘れて困ったね」と気持ちを受け止めることは、忘れ物を許すことではありません。気持ちを受け止めたあとで、こちらの願いを伝えるほうが言葉が届きやすくなります。',
    s: '注意する前に、まず「そっか、困ったね」を1回挟んでみる。' },
  { t: '1か月前の娘さんと比べてみましょう',
    b: 'SNSで見る「できる子」は、ごく一部のうまくいった場面です。比べて元気が出る親子は少なく、多くは焦りとイライラが増えます。比べるなら、自分の子の過去です。',
    s: '1か月前の娘さんと比べて、少しでもできるようになったことを1つ探してみる。' },
  { t: '家が安心できる場所だと、学校で頑張れます',
    b: '娘さんは学校で、毎日たくさんのことを頑張っています。家で「ほっとできる」ことが、外で頑張るエネルギーの充電になります。',

function inLastDays(rec, n) { return rec.d >= daysAgoStr(n - 1); }
function weekGoods() { return state.goods.filter(function (g) { return inLastDays(g, 7); }); }
function weekIrr() { return state.irritations.filter(function (r) { return inLastDays(r, 7); }); }
function weekForgot() { return state.forgot.filter(function (r) { return inLastDays(r, 7); }); }
function prevWeekIrr() {
  var from = daysAgoStr(13), to = daysAgoStr(7);
  return state.irritations.filter(function (r) { return r.d >= from && r.d < to; });
}
function allChecked(dateStr) {
  if (!state.items.length) return false;
  var c = state.checks[dateStr] || {};
  return state.items.every(function (it) { return c[it.id]; });
}
function checkedCount() {
  var c = state.checks[todayStr()] || {};
  return state.items.filter(function (it) { return c[it.id]; }).length;
}
function hasItem(name) { return state.items.some(function (it) { return it.name === name; }); }
function addItem(name) {
  name = (name || '').trim();
  if (!name) return false;
  if (hasItem(name)) return false;
  state.items.push({ id: 'i' + Date.now() + Math.floor(Math.random() * 1000), name: name });
  save();
  return true;
}

function fmt(sec) { return pad(Math.floor(sec / 60)) + ':' + pad(sec % 60); }
function startTimer(kind) {
  var len = (kind === 'break') ? 5 : timer.mins;
  timer.kind = kind; timer.endAt = Date.now() + len * 60000; timer.running = true; timer.done = '';
  render();
}
function stopTimer() { timer.running = false; timer.done = ''; render(); }
function finishTimer() {
  timer.running = false;
  if (timer.kind === 'focus') {
    var t = todayStr();
    state.sessions[t] = (state.sessions[t] || 0) + 1; save();
    timer.done = 'focus';
    toast('お疲れさま。1セット完了です');
  } else {
    timer.done = 'break';
    toast('休憩おわり');
  }
  if (tab === 'forget' && forgetMode === 'focus') render();
}
function tick() {
  if (!timer.running) return;
  var left = Math.max(0, Math.ceil((timer.endAt - Date.now()) / 1000));
  var el = document.getElementById('timer-disp');
  if (el) el.textContent = fmt(left);
  if (left <= 0) finishTimer();
}
function todayGoals() { return state.goals[todayStr()] || []; }
function addGoal(text) {
  text = (text || '').trim();
  if (!text) return false;
  var t = todayStr();
  if (!state.goals[t]) state.goals[t] = [];
  state.goals[t].push({ id: 'g' + Date.now() + Math.floor(Math.random() * 1000), text: text, done: false });
  save();
  return true;
}

      '<div class="sub">今朝は何時に起きましたか? 部活のあと、どんな顔で帰ってきましたか?</div>' +
      '<button class="btn" data-go="log-good">良かった点を記録する</button>' +
      '<button class="btn ghost" data-go="log-irr">イライラ記録をつける</button></div>';
  }
  return h;
}

function renderLog() {
  var h = '<div class="seg"><button data-logmode="irr" class="' + (logMode === 'irr' ? 'on' : '') + '">イライラ記録</button>' +
          '<button data-logmode="good" class="' + (logMode === 'good' ? 'on' : '') + '">良かった点</button></div>';
  if (logMode === 'irr') {
    h += '<div class="card"><h2>どんなときでしたか?</h2><div class="chips">';
    TRIGGERS.forEach(function (t) {
      h += '<button class="chip o' + (irrTrigger === t ? ' on' : '') + '" data-itrig="' + esc(t) + '">' + esc(t) + '</button>';
    });
    h += '</div><h2 style="margin-top:12px">イライラの強さ</h2><div class="lvl">';
    for (var i = 1; i <= 5; i++) h += '<button data-ilvl="' + i + '" class="' + (irrLevel === i ? 'on' : '') + '">' + i + '</button>';
    h += '</div><div class="sub">1=少しモヤッ ／ 5=かなり強い</div>' +
      '<textarea id="irr-note" placeholder="ひとことメモ(任意)" style="margin-top:10px"></textarea>' +
      '<button class="btn o" data-save="irr">記録する</button></div>';
    var list = state.irritations.slice().reverse().slice(0, 15);
    h += '<div class="card"><h2>最近の記録</h2>';
    if (!list.length) h += '<div class="empty">まだ記録がありません</div>';
    list.forEach(function (r) {
      h += '<div class="rec"><div class="row"><div><b>' + esc(r.trigger) + '</b>(強さ ' + r.level + ')' +
        (r.note ? '<br>' + esc(r.note) : '') + '<div class="meta">' + dispDate(r.d) + '</div></div>' +
        '<button class="del" data-del="irr:' + r.ts + '">削除</button></div></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="card"><h2>今日の「良かった点」</h2>' +
      '<div class="chips"><button class="chip' + (goodKind === '今日の頑張り' ? ' on' : '') + '" data-gkind="今日の頑張り">今日の頑張り</button>' +
      '<button class="chip' + (goodKind === '前よりできるように' ? ' on' : '') + '" data-gkind="前よりできるように">前よりできるように</button></div>' +
      '<div class="sub">タップで入力できます</div><div class="chips">';
    GOOD_QUICK.forEach(function (q) { h += '<button class="chip" data-gquick="' + esc(q) + '">' + esc(q) + '</button>'; });
    h += '</div><input type="text" id="good-text" placeholder="自由に書く(例:自分から○○を始めた)">' +
      '<button class="btn" data-save="good">記録する</button></div>';
    var gl = state.goods.slice().reverse().slice(0, 20);
    h += '<div class="card"><h2>これまでの良かった点</h2>';
    if (!gl.length) h += '<div class="empty">まだ記録がありません</div>';
    gl.forEach(function (g) {
      h += '<div class="rec"><div class="row"><div>' + esc(g.text) +
        '<div class="meta">' + dispDate(g.d) + ' ・ ' + esc(g.kind) + '</div></div>' +
        '<button class="del" data-del="good:' + g.ts + '">削除</button></div></div>';
    });
    h += '</div>';
  }
  return h;
}

function renderReview() {
  var wi = weekIrr(), wg = weekGoods(), pw = prevWeekIrr(), wf = weekForgot();
  var h = '<h1>この1週間のふり返り</h1><div class="sub" style="margin-bottom:12px">直近7日間の記録から</div>';
  h += '<div class="stats">' +
    '<div class="stat"><div class="big">' + wg.length + '</div><div class="lab">良かった点</div></div>' +
    '<div class="stat"><div class="big">' + wi.length + '</div><div class="lab">イライラ記録</div></div>' +
    '<div class="stat"><div class="big">' + wf.length + '</div><div class="lab">忘れ物</div></div></div>';
  h += '<div class="card" style="margin-top:14px"><h2>気持ちが動いたきっかけ</h2>';
  if (!wi.length) {
    h += '<div class="empty">今週の記録はまだありません</div>';
  } else {
    var counts = {};
    wi.forEach(function (r) { counts[r.trigger] = (counts[r.trigger] || 0) + 1; });
    var names = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
    var max = counts[names[0]];
    names.forEach(function (n) {
      h += '<div class="bar-row"><div class="name">' + esc(n) + '</div><div class="bar"><div style="width:' +
        Math.round(counts[n] / max * 100) + '%"></div></div><div class="n">' + counts[n] + '</div></div>';
    });
    var top = names[0];
    var msg;
    if (top === 'SNSを見た直後') msg = 'SNSを見た直後が一番多い週でした。見る時間帯を決める、夜は見ないなど、入口を少し減らすだけで気持ちが軽くなることがあります。';
    else if (top === 'だらだら勉強') msg = 'だらだら勉強が気になる場面が多い週でした。「仕組み」タブの集中タイマーと、だらだらの理由さがしを試して、急かす声かけを1つ減らしてみてください。';
    else if (top === '同級生の話を聞いた') msg = '同級生の話がきっかけの週でした。娘さんの話を「聞く」ことと、娘さん自身を「認める」ことを意識すると、比べる気持ちが少し落ち着きます。';
    else if (top === '自分が疲れている') msg = '「自分が疲れている」が一番多い週でした。平日ほぼお一人で回しているのですから当然です。今週は声かけを1つ減らす、チェックは娘さんに任せるなど、減らす工夫を試してみてください。';
    else msg = '「' + top + '」の場面が一番多い週でした。この場面だけ、声かけを1つ減らす、または言い換えてみるのがおすすめです。';
    h += '<div class="step" style="margin-top:12px">' + esc(msg) + '</div>';
    if (pw.length) {
      var diff = wi.length - pw.length;
      h += '<div class="sub" style="margin-top:8px">先週より ' + (diff > 0 ? diff + '件 多め' : diff < 0 ? (-diff) + '件 少なめ' : '同じ件数') + 'でした。</div>';
    }
  }
  h += '</div>';

  /* 忘れ物 */
  var okDays = 0;
  var rtDone = 0, rtTotal = 0, rtMustDays = 0;
  for (var q = 0; q < 7; q++) { var rs = routineStat(daysAgoStr(q)); rtDone += rs.done; rtTotal += rs.total; if (rs.mustDone === rs.mustTotal && rs.mustTotal > 0) rtMustDays++; }
  var focusDays = 0;
  for (var k = 0; k < 7; k++) { if (allChecked(daysAgoStr(k))) okDays++; if ((state.sessions[daysAgoStr(k)] || 0) > 0) focusDays++; }
  h += '<div class="card"><h2>仕組みの使用状況・忘れ物</h2>' +
    '<div class="sub">前夜チェックを全部済ませた日: ' + okDays + ' / 7日<br>集中タイマーを使った日: ' + focusDays + ' / 7日<br>ルーティン達成: ' + rtDone + ' / ' + rtTotal + ' 科目、毎日必ずの3科目がそろった日: ' + rtMustDays + ' / 7日</div>';
  if (!wf.length) {
    h += '<div class="empty">今週の忘れ物の記録はありません</div>';
  } else {
    var fc = {};
    wf.forEach(function (f) { fc[f.text] = (fc[f.text] || 0) + 1; });
    var fn = Object.keys(fc).sort(function (a, b) { return fc[b] - fc[a]; });
    var fmax = fc[fn[0]];
    fn.slice(0, 5).forEach(function (n) {
      h += '<div class="bar-row"><div class="name">' + esc(n) + '</div><div class="bar"><div style="width:' +
        Math.round(fc[n] / fmax * 100) + '%"></div></div><div class="n">' + fc[n] + '</div></div>';
    });
    var topF = fn[0];
    if (!hasItem(topF)) {
      h += '<button class="btn ghost" data-addtocheck="' + esc(topF) + '">「' + esc(topF) + '」を前夜チェックに追加する</button>';
    } else {
      h += '<div class="step" style="margin-top:10px">「' + esc(topF) + '」はすでにチェック表にあります。確認のタイミングを娘さんと一緒に考えてみてください。</div>';
    }
  }
  h += '</div>';

  h += '<div class="card green"><h2>今週見つけた良かった点</h2>';
  if (!wg.length) {
    h += '<div class="empty">記録するとここに並びます</div>';
  } else {
    wg.slice().reverse().forEach(function (g) {
      h += '<div class="rec">' + esc(g.text) + '<div class="meta">' + dispDate(g.d) + ' ・ ' + esc(g.kind) + '</div></div>';
    });
  }
  h += '</div>';

  h += '<div class="card ref"><h2>参考にした情報</h2><div class="sub" style="margin-bottom:6px">このアプリのヒントは、次のような公開情報をもとにまとめています。専門家の診断や個別の助言ではありません。</div>';
  REFS.forEach(function (r) { h += '<a href="' + esc(r[1]) + '" target="_blank" rel="noopener">' + esc(r[0]) + '</a>'; });
  h += '</div>';
  h += '<div class="note">記録はこの端末のブラウザ内にのみ保存されます</div>';
  return h;
}

function render() {
  var html = '';
  if (tab === 'home') html = renderHome();
  else if (tab === 'voice') html = renderVoice();
  else if (tab === 'forget') html = renderForget();
  else if (tab === 'pause') html = renderPause();
  else if (tab === 'log') html = renderLog();
  else html = renderReview();
  view.innerHTML = html;
  var btns = document.querySelectorAll('#nav button');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = (btns[i].getAttribute('data-tab') === tab) ? 'on' : '';
  }
}

function goTab(t) {
  tab = t; breathing = false;
  render();
  document.getElementById('main').scrollTop = 0;
}

/* ---------- 保存処理 ---------- */
function saveIrr() {
  if (!irrTrigger) { toast('きっかけを選んでください'); return; }
  if (!irrLevel) { toast('強さを選んでください'); return; }
  var noteEl = document.getElementById('irr-note');
  state.irritations.push({ d: todayStr(), ts: Date.now(), trigger: irrTrigger, level: irrLevel, note: noteEl ? noteEl.value.trim() : '' });
  save(); irrTrigger = ''; irrLevel = 0;
  toast('記録しました。お疲れさまです');
  render();
}
function saveGood() {
  var el = document.getElementById('good-text');
  var text = el ? el.value.trim() : '';
  if (!text) { toast('内容を入力するか、候補をタップしてください'); return; }
  state.goods.push({ d: todayStr(), ts: Date.now(), kind: goodKind, text: text });
  save();
  toast('素敵な発見ですね');
  render();
}
function saveForgot() {
  var el = document.getElementById('forgot-text');
  var text = el ? el.value.trim() : '';
  if (!text) { toast('何を忘れたか入力するか、候補をタップしてください'); return; }
  state.forgot.push({ d: todayStr(), ts: Date.now(), text: text });
  save();
  toast('記録しました。責めずに「次はどうする?」を一緒に');
  render();
}
function toggleCheck(id) {
  var t = todayStr();
  if (!state.checks[t]) state.checks[t] = {};
  state.checks[t][id] = !state.checks[t][id];
  save();
  render();
}

/* ---------- イベント(委譲) ---------- */
document.addEventListener('click', function (e) {
  var el = e.target;
  while (el && el !== document.body && !(el.dataset && Object.keys(el.dataset).length)) el = el.parentNode;
  if (!el || !el.dataset) return;
  var d = el.dataset;
  if (d.tab) { goTab(d.tab); return; }
  if (d.go) {
    if (d.go === 'log-good') { logMode = 'good'; goTab('log'); }
    else if (d.go === 'log-irr') { logMode = 'irr'; goTab('log'); }
    else if (d.go === 'paper') { forgetMode = 'paper'; goTab('forget'); }
    else if (d.go === 'pause-dara') { pauseTrigger = 'だらだら勉強'; goTab('pause'); }
    else goTab(d.go);
    return;
  }
  if (d.vmode) { voiceMode = d.vmode; render(); return; }
  if (d.voice !== undefined) { voiceOpen = parseInt(d.voice, 10); render(); return; }
  if (d.scene !== undefined) { scene = parseInt(d.scene, 10); render(); return; }
  if (d.fmode) { forgetMode = d.fmode; render(); return; }
  if (d.chk) { toggleCheck(d.chk); return; }
  if (d.preset) { addItem(d.preset); render(); return; }
  if (d.additem) {
    var it = document.getElementById('item-text');
    var v = it ? it.value.trim() : '';
    if (!v) { toast('項目を入力してください'); return; }
    if (!addItem(v)) { toast('すでにある項目です'); return; }
    render(); return;
  }
  if (d.rt) { var rd = todayStr(); if (!state.routine[rd]) state.routine[rd] = {}; state.routine[rd][d.rt] = !state.routine[rd][d.rt]; save(); render(); return; }
  if (d.why !== undefined) { whyIdx = parseInt(d.why, 10); render(); return; }
  if (d.fmin) { timer.mins = parseInt(d.fmin, 10); render(); return; }
  if (d.timerstart) { startTimer(d.timerstart); return; }
  if (d.timerstop) { stopTimer(); return; }
  if (d.goaladd) {
    var ge = document.getElementById('goal-text');
    if (!addGoal(ge ? ge.value : '')) { toast('ゴールを入力してください'); return; }
    render(); return;
  }
  if (d.goaltog) {
    todayGoals().forEach(function (g) { if (g.id === d.goaltog) g.done = !g.done; });
    save(); render(); return;
  }
  if (d.fquick) { var f = document.getElementById('forgot-text'); if (f) f.value = d.fquick; return; }
  if (d.saveforgot) { saveForgot(); return; }
  if (d.addtocheck) { if (addItem(d.addtocheck)) toast('前夜チェックに追加しました'); render(); return; }
  if (d.ptrig) { pauseTrigger = d.ptrig; breathing = false; render(); return; }
  if (d.breath) { breathing = !breathing; render(); return; }
  if (d.logmode) { logMode = d.logmode; render(); return; }
  if (d.itrig) { irrTrigger = d.itrig; keepText(); return; }
  if (d.ilvl) { irrLevel = parseInt(d.ilvl, 10); keepText(); return; }
  if (d.gkind) { goodKind = d.gkind; keepText(); return; }
  if (d.gquick) { var g = document.getElementById('good-text'); if (g) g.value = d.gquick; return; }
  if (d.save === 'irr') { saveIrr(); return; }
  if (d.save === 'good') { saveGood(); return; }
  if (d.del) {
    pendingDelete = d.del;
    document.getElementById('confirm-modal').classList.add('active');
    return;
  }
});

/* 入力中のテキストを保ったまま再描画 */
function keepText() {
  var n = document.getElementById('irr-note'), g = document.getElementById('good-text');
  var nv = n ? n.value : '', gv = g ? g.value : '';
  render();
  var n2 = document.getElementById('irr-note'), g2 = document.getElementById('good-text');
  if (n2) n2.value = nv;
  if (g2) g2.value = gv;
}

document.getElementById('m-no').onclick = function () {
  pendingDelete = null;
  document.getElementById('confirm-modal').classList.remove('active');
};
document.getElementById('m-yes').onclick = function () {
  if (pendingDelete) {
    var idx = pendingDelete.indexOf(':');
    var kind = pendingDelete.slice(0, idx);
    var rest = pendingDelete.slice(idx + 1);
    if (kind === 'item') {
      state.items = state.items.filter(function (r) { return r.id !== rest; });
    } else if (kind === 'goal') {
      var gd = todayStr();
      state.goals[gd] = (state.goals[gd] || []).filter(function (r) { return r.id !== rest; });
    } else {
      var ts = parseInt(rest, 10);
      if (kind === 'irr') state.irritations = state.irritations.filter(function (r) { return r.ts !== ts; });
      else if (kind === 'forgot') state.forgot = state.forgot.filter(function (r) { return r.ts !== ts; });
      else state.goods = state.goods.filter(function (r) { return r.ts !== ts; });
    }
    save();
  }
  pendingDelete = null;
  document.getElementById('confirm-modal').classList.remove('active');
  render();
};

setInterval(tick, 500);
render();
</script>
</body>
</html>
